name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: ./mvnw verify (тесты, ArchUnit, Testcontainers, JaCoCo gate)
        run: ./mvnw verify
