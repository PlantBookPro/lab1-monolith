server:
  port: 8080
spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 16MB
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: tournaments-service
              uri: lb://tournaments-service
              predicates:
                - Path=/api/v1/tournaments/**,/api/v1/global/**,/api/v1/guest-sessions/**,/api/v1/windows/**,/api/v1/me/invitations/**,/api/v1/me/global-entry,/api/v1/invitations/**,/api/v1/tags/**,/api/v1/internal/**
            - id: feed-service
              uri: lb://feed-service
              predicates:
                - Path=/api/v1/feed/**
            - id: plants-service
              uri: lb://plants-service
              predicates:
                - Path=/api/v1/plants/**
            - id: media-service
              uri: lb://media-service
              predicates:
                - Path=/api/v1/files/**
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/users/**,/api/v1/me/**
            - id: identity-service-direct
              uri: lb://identity-service
              predicates:
                - Path=/identity-service/**
              filters:
                - StripPrefix=1
            - id: media-service-direct
              uri: lb://media-service
              predicates:
                - Path=/media-service/**
              filters:
                - StripPrefix=1
            - id: plants-service-direct
              uri: lb://plants-service
              predicates:
                - Path=/plants-service/**
              filters:
                - StripPrefix=1
            - id: moderation-service-direct
              uri: lb://moderation-service
              predicates:
                - Path=/moderation-service/**
              filters:
                - StripPrefix=1
            - id: geo-service-direct
              uri: lb://geo-service
              predicates:
                - Path=/geo-service/**
              filters:
                - StripPrefix=1
            - id: tournaments-service-direct
              uri: lb://tournaments-service
              predicates:
                - Path=/tournaments-service/**
              filters:
                - StripPrefix=1
            - id: feed-service-direct
              uri: lb://feed-service
              predicates:
                - Path=/feed-service/**
              filters:
                - StripPrefix=1
          discovery:
            locator:
              enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
