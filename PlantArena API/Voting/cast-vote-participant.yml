{
  "info": {
    "name": "Cast vote - Participant",
    "type": "http",
    "seq": 1
  },
  "http": {
    "method": "PUT",
    "url": "{{baseUrl}}/api/v1/windows/:windowId/entries/:entryId/vote",
    "headers": [
      {
        "name": "Accept",
        "value": "application/json",
        "description": "Expected response format"
      },
      {
        "name": "X-Demo-User-Id",
        "value": "{{participantUserId}}",
        "description": "UUID of an existing active user; role is loaded from the database"
      },
      {
        "name": "X-Guest-Token",
        "value": "{{guestToken}}",
        "description": "Ignored when X-Demo-User-Id identifies a user",
        "disabled": true
      },
      {
        "name": "Content-Type",
        "value": "application/json",
        "description": "JSON request body"
      }
    ],
    "params": [
      {
        "name": "windowId",
        "value": "{{windowId}}",
        "type": "path",
        "description": "windowId path identifier"
      },
      {
        "name": "entryId",
        "value": "{{entryId}}",
        "type": "path",
        "description": "entryId path identifier"
      }
    ],
    "body": {
      "type": "json",
      "data": "{\n  \"value\": \"{{voteValue}}\"\n}"
    }
  },
  "settings": {
    "encodeUrl": true,
    "timeout": 0,
    "followRedirects": true,
    "maxRedirects": 5
  },
  "examples": [
    {
      "name": "200 Response",
