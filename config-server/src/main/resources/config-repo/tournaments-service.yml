spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/tournaments
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: tournaments
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true
plantarena:
  global:
    epoch-duration: 24h
    final-window-duration: 6h
  guests:
    session-ttl: 24h
    session-creation-limit-per-minute: 10
    vote-limit-per-minute: 30
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
    instances:
      identity-service:
        baseConfig: default
      plants-service:
        baseConfig: default
      geo-service:
        baseConfig: default
      feed-service:
        baseConfig: default
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
